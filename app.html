<title>Gulf Energy Jobs — Oil, Gas & Energy Careers in the Gulf</title>
<style>
  :root {

    --navy-900:#071a2f; --navy-800:#0b2440; --navy-700:#123256; --navy-600:#1c4373;

      --border:#193651;
      --border-strong:#25506f;
      --ink:#eaf1fa;
      --ink-soft:#a9bdd6;
      --ink-mute:#7791ae;
      --accent:#2dd4bf;
      --accent-ink:#05221f;
      --signal:#ffbf47;
      --hero-grad-1:#040c17; --hero-grad-2:#0b2440;
      --hero-ink:#ffffff; --hero-soft:#c6d4e6; --hero-mute:#93a8c2;

  /* Buttons */

  /* Hero */

  .hero-badge .dot { width:8px; height:8px; border-radius:50%; background:var(--teal-400); box-shadow:0 0 0 4px rgba(45,212,191,.25); }
  .search { display:flex; gap:.5rem; max-width:760px; margin:0 auto; background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow-lg); padding:.55rem; }

  /* Sections */

  .meta span { display:inline-flex; align-items:center; gap:.35rem; }
  .summary { color:var(--ink-soft); font-size:.9rem; margin-bottom:1rem; flex:1; }
  .tags { display:flex; flex-wrap:wrap; gap:.4rem; margin-bottom:1rem; }
  .tag { font-size:.72rem; font-weight:700; padding:.26rem .62rem; border-radius:999px; background:var(--surface-2); color:var(--ink-soft); }

  .tag.remote { background:color-mix(in srgb,var(--green) 16%,transparent); color:var(--green); }
  .foot { display:flex; align-items:center; justify-content:space-between; gap:1rem; border-top:1px solid var(--border); padding-top:.95rem; margin-top:auto; }

  .flag-featured { position:absolute; top:1.1rem; right:1.1rem; background:var(--amber-500); color:#071a2f; font-size:.64rem; font-weight:800;

  /* Category + country tiles */
  .tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:1rem; }
  .tile { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:1.3rem; display:flex; align-items:center; gap:.95rem;

  .country:hover { transform:translateY(-3px); box-shadow:var(--shadow-md); border-color:var(--accent); }
  .country .fl { font-size:2rem; margin-bottom:.35rem; }
  .country .cn { font-weight:700; color:var(--ink); font-size:.94rem; }
  .country .cc { color:var(--ink-mute); font-size:.8rem; }

  /* Features */
  .features { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:1.6rem; }
  .feature { text-align:center; padding:.6rem; }
  .feature .fi { width:54px; height:54px; border-radius:16px; display:grid; place-items:center; margin:0 auto 1rem;
    background:color-mix(in srgb,var(--accent) 14%,transparent); color:var(--accent); }
  .feature h3 { margin-bottom:.35rem; } .feature p { color:var(--ink-mute); font-size:.9rem; margin:0; }

  /* CTA band */
  .band { background:linear-gradient(158deg,var(--navy-800),var(--navy-600)); color:#fff; border-radius:20px; padding:3rem; text-align:center; }
  .band h2 { color:#fff; } .band p { color:var(--hero-soft); max-width:56ch; margin:0 auto 1.6rem; }
  .band .row { display:flex; gap:.8rem; justify-content:center; flex-wrap:wrap; }

  /* Page head (list/detail) */
  .phead { background:linear-gradient(158deg,var(--hero-grad-1),var(--hero-grad-2)); color:#fff; padding:2.6rem 0; }
  .phead h1 { color:#fff; font-size:clamp(1.6rem,3.2vw,2.3rem); margin-bottom:.35rem; }

  /* Listing */

  .fgroup { margin-bottom:1.4rem; } .fgroup:last-of-type { margin-bottom:.6rem; }

  .check .ct { color:var(--ink-mute); margin-left:auto; font-variant-numeric:tabular-nums; }
  .fsearch { width:100%; padding:.7rem .85rem; border:1px solid var(--border-strong); border-radius:var(--radius-sm); font:inherit; font-size:.92rem;

  .rbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.1rem; flex-wrap:wrap; gap:.8rem; }

  .sortsel { padding:.52rem .8rem; border:1px solid var(--border-strong); border-radius:var(--radius-sm); font:inherit; font-size:.87rem; color:var(--ink-soft); background:var(--surface); cursor:pointer; }
  .list { display:flex; flex-direction:column; gap:1rem; }
  .empty { text-align:center; padding:3rem; color:var(--ink-mute); background:var(--surface); border-radius:var(--radius); border:1px dashed var(--border-strong); }

  /* Detail */
  .detail { display:grid; grid-template-columns:1fr 330px; gap:2rem; padding:2.4rem 0; align-items:start; }
  .dmain { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:2rem; box-shadow:var(--shadow-sm); }
  .dhead { display:flex; gap:1.2rem; align-items:flex-start; margin-bottom:1.4rem; padding-bottom:1.4rem; border-bottom:1px solid var(--border); }
  .dhead .logo { width:62px; height:62px; font-size:1.1rem; }

  .dsec h2 { font-size:1.15rem; margin-bottom:.7rem; }

  .dsec p { color:var(--ink-soft); margin:0; }
  .aside { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:1.6rem; box-shadow:var(--shadow-sm); position:sticky; top:84px; }
  .aside .pay { font-size:1.35rem; font-weight:800; color:var(--ink); letter-spacing:-.01em; }
  .aside .payp { font-size:.82rem; color:var(--ink-mute); margin-bottom:1rem; }
  .facts { list-style:none; padding:0; margin:1.2rem 0; }
  .facts li { display:flex; justify-content:space-between; gap:1rem; padding:.6rem 0; border-bottom:1px solid var(--border); font-size:.89rem; }

  .fgrid { display:grid; grid-template-columns:1fr 1fr; gap:1.1rem; }

  .note { font-size:.82rem; color:var(--ink-mute); }
  .success { background:color-mix(in srgb,var(--green) 12%,transparent); border:1px solid color-mix(in srgb,var(--green) 34%,transparent); color:var(--green);

  .values { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:1.3rem; margin:1.8rem 0; }

  .value .vi { width:44px; height:44px; border-radius:12px; display:grid; place-items:center; font-size:1.3rem;

  .value h3 { font-size:1.02rem; } .value p { color:var(--ink-mute); font-size:.89rem; margin:0; }
  .prose > p, .prose > h2 { color:var(--ink-soft); } .prose h2 { color:var(--ink); margin-top:2rem; }

  /* Footer */

  footer.app .brand .bt { color:#fff; } footer.app .brand .bt small { color:#7f93ab; }
  .fgrid2 { display:grid; grid-template-columns:1.6fr repeat(3,1fr); gap:2rem; }
  footer.app h4 { color:#fff; font-size:.8rem; text-transform:uppercase; letter-spacing:.1em; margin-bottom:1rem; }
  footer.app ul { list-style:none; margin:0; padding:0; } footer.app li { margin-bottom:.55rem; }

    if(listState.types.length&&listState.types.indexOf(j.employmentType)===-1)return false;
    return true;});
  f.sort((a,b)=>{if(listState.sort==="salary")return b.salaryMax-a.salaryMax; if(listState.sort==="az")return a.title.localeCompare(b.title);

// Ambient hero canvas — rising energy particles
function startHeroCanvas(){
  const c=document.getElementById("heroCanvas"); if(!c)return;
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const ctx=c.getContext("2d"); let w,h,parts,raf;
  function size(){const r=c.getBoundingClientRect();w=c.width=r.width;h=c.height=r.height;
    parts=Array.from({length:Math.min(60,Math.floor(w/22))},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2+.6,s:Math.random()*.5+.15,o:Math.random()*.5+.2}));}
  size();
  function draw(){ctx.clearRect(0,0,w,h);
    for(const p of parts){p.y-=p.s;if(p.y< -5){p.y=h+5;p.x=Math.random()*w;}
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fillStyle="rgba(45,212,191,"+p.o+")";ctx.fill();}
    raf=requestAnimationFrame(draw);}
  cancelAnimationFrame(raf);draw();
  let to;window.addEventListener("resize",()=>{clearTimeout(to);to=setTimeout(size,200);},{passive:true});
}
