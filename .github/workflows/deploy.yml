name: Deploy Gulf Energy Jobs to GitHub Pages

# This workflow self-enables GitHub Pages (actions/configure-pages with
# enablement: true), builds the static site, and deploys it — no manual
# Settings -> Pages toggle required. It runs on every push to main and can
# also be triggered manually from the Actions tab.
#
# Note: GitHub Pages on a PRIVATE repo requires a paid plan (Pro/Team/...).
# On the free plan, make the repository public (Settings -> General) for Pages
# to publish.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure Pages (auto-enable)
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build static site
        # Use the resolved Pages URL as SITE_URL so canonical tags, the sitemap
        # and JSON-LD structured data all use correct absolute URLs. Override by
        # setting a repository "SITE_URL" Actions variable (e.g. a custom domain).
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}
        run: node scripts/build.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
