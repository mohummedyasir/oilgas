name: Deploy Gulf Energy Jobs to GitHub Pages

# OPTIONAL — only if your account has GitHub Actions hosted runners available.
#
# The simplest way to launch this site needs NO Actions runner: the built HTML
# is committed at the repo root, so use branch-based Pages instead —
#   Settings -> Pages -> Build and deployment -> Source: "Deploy from a branch"
#   -> Branch: main, Folder: / (root) -> Save.
# The site then serves at https://<user>.github.io/<repo>/ within ~1 minute.
#
# This workflow is an alternative (Actions-based) deploy. It is manual-dispatch
# only so it never spawns queued/cancelled runs on push. Run it from the
# Actions tab if and when hosted runners are available to your account.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure Pages (auto-enable)
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build static site
        # Use the resolved Pages URL as SITE_URL so canonical tags, the sitemap
        # and JSON-LD structured data all use correct absolute URLs. Override by
        # setting a repository "SITE_URL" Actions variable (e.g. a custom domain).
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}
        run: node scripts/build.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
